name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache 
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - run: mkdocs build
      - name: Verify public entry points
        run: |
          test -f site/index.html
          grep -q 'Kehan LAN' site/index.html
          grep -q 'y2k-home' site/index.html
          test -f site/cv/index.html
          grep -q 'khlan_s_resume.pdf' site/cv/index.html
          grep -q 'G-T9MWFJSM3X' site/cv/index.html
          cmp docs/khlan_s_resume.pdf site/khlan_s_resume.pdf
      - run: mkdocs gh-deploy --force
      - name: Debug build
        run: |
          ls -la docs/stylesheets/
          mkdocs build --verbose
